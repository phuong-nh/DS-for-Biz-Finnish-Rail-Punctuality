[project]
name = "dsforbiz-finnish-rail-punctuality"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Phuong Nguyen", email = "phuong.6.nguyen@aalto.fi" }
]
requires-python = ">=3.15"
dependencies = [
    "marimo>=0.25.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
]

[project.scripts]
dsforbiz-finnish-rail-punctuality = "dsforbiz_finnish_rail_punctuality:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pandas-stubs>=3.0.5.260914",
]

[tool.ruff.lint.per-file-ignores]
"notebook.py" = ["B018", "F841", "PLR1711"]
"*notebook*.py" = ["B018", "F841", "PLR1711"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = true
reportUnknownVariableType = true
reportUnknownParameterType = true
reportUnknownArgumentType = true
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = "none"

executionEnvironments = [
  { root = "notebook.py", reportMissingParameterType = "none", reportUnknownVariableType = "none", reportUnknownParameterType = "none", reportUnknownArgumentType = "none", reportUnknownMemberType = "none", reportAttributeAccessIssue = "none", reportUnusedExpression = "none", reportUnusedVariable = "none", reportUnusedCallResult = "none" }
]
